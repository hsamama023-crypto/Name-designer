<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5000+ Stylish Names - Girls & Boys | By Samama</title>
<meta name="theme-color" content="#FF006A">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#000;color:#fff;min-height:100vh}
.header{padding:18px;text-align:center;position:sticky;top:0;z-index:10;background:rgba(0,0,0,0.95);border-bottom:1px solid #222}
.header h1{font-size:20px;font-weight:800}
.mainTab{display:flex;gap:10px;padding:10px;background:#000;position:sticky;top:68px;z-index:9}
.mainTab div{flex:1;padding:13px;text-align:center;border-radius:100px;font-weight:800;font-size:12px;cursor:pointer;border:2px solid #222}
.mainTab .girls{background:linear-gradient(135deg,#FF006A,#FF8A9B);color:#fff;border-color:transparent}
.mainTab .boys{background:#111;color:#777}
.mainTab .boys.active{background:linear-gradient(135deg,#0066FF,#00D4FF);color:#fff;border-color:transparent}
.mainTab .girls.active2{background:#111;color:#777}
.container{max-width:500px;margin:0 auto;padding:10px}
.box{background:#111;border:1px solid #222;border-radius:16px;padding:12px}
.box input{width:100%;padding:14px;background:#000;border:1.5px solid #333;border-radius:12px;color:#fff;font-size:16px;font-weight:700;text-align:center;outline:none}
.box input::placeholder{color:#555;font-weight:600}
.box input:focus{border-color:#FF006A}
.btn{width:100%;padding:13px;background:linear-gradient(90deg,#FF006A,#FFD600);border:0;border-radius:100px;color:#000;font-weight:800;font-size:13px;margin-top:8px;cursor:pointer}
.subTabs{display:flex;gap:6px;overflow:auto;padding:10px 0}.subTabs::-webkit-scrollbar{display:none}
.subTab{padding:6px 10px;background:#111;border:1px solid #222;border-radius:100px;font-size:9px;font-weight:700;white-space:nowrap;cursor:pointer}.subTab.active{background:#fff;color:#000}
.card{background:#0F0F0F;border:1px solid #1a1a1a;border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.card.girlCard{border-left:2.5px solid #FF006A}
.card.boyCard{border-left:2.5px solid #00D4FF}
.name{font-size:14px;flex:1;padding-right:6px;word-break:break-all}
.copy{padding:5px 10px;background:#fff;color:#000;border:0;border-radius:100px;font-size:10px;font-weight:800;cursor:pointer;min-width:55px}
.count{font-size:9px;color:#666;margin:6px 0;font-weight:700}
</style>
</head>
<body>
<div class="header">
<h1 id="title">💖 5000+ GIRLS & BOYS NAMES 💙</h1>
<p style="font-size:8px;color:#555;margin-top:3px">2500 GIRLS • 2500 BOYS • BY SAMAMA</p>
</div>

<div class="container">
<div class="mainTab">
<div id="girlsBtn" class="girls" onclick="setGender('girls')">💖 GIRLS 2500</div>
<div id="boysBtn" class="boys" onclick="setGender('boys')">💙 BOYS 2500</div>
</div>

<div class="box">
<input id="nameInput" type="text" placeholder="write name" value="" oninput="generate()">
<button class="btn" onclick="generate()">✨ GENERATE 5000+ STYLES ✨</button>
</div>

<div class="subTabs" id="subTabs"></div>
<div class="count" id="count">WRITE NAME TO SEE 5000 STYLES</div>
<div id="list"></div>
</div>

<script>
let gender='girls';
let subCat='all';

// 10 FONT STYLES
const fancy=[
t=>t,
t=>t.split('').map(c=>{const m={'a':'ᴀ','b':'ʙ','c':'ᴄ','d':'ᴅ','e':'ᴇ','f':'ғ','g':'ɢ','h':'ʜ','i':'ɪ','j':'ᴊ','k':'ᴋ','l':'ʟ','m':'ᴍ','n':'ɴ','o':'ᴏ','p':'ᴘ','q':'ǫ','r':'ʀ','s':'ꜱ','t':'ᴛ','u':'ᴜ','v':'ᴠ','w':'ᴡ','x':'x','y':'ʏ','z':'ᴢ'};return m[c.toLowerCase()]||c}).join(''),
t=>t.split('').map(c=>{const m={'a':'𝒶','b':'𝒷','c':'𝒸','d':'𝒹','e':'𝑒','f':'𝒻','g':'𝑔','h':'𝒽','i':'𝒾','j':'𝒿','k':'𝓀','l':'𝓁','m':'𝓂','n':'𝓃','o':'𝑜','p':'𝓅','q':'𝓆','r':'𝓇','s':'𝓈','t':'𝓉','u':'𝓊','v':'𝓋','w':'𝓌','x':'𝓍','y':'𝓎','z':'𝓏'};return m[c.toLowerCase()]||c}).join(''),
t=>t.split('').map(c=>{const m={'a':'𝓪','b':'𝓫','c':'𝓬','d':'𝓭','e':'𝓮','f':'𝓯','g':'𝓰','h':'𝓱','i':'𝓲','j':'𝓳','k':'𝓴','l':'𝓵','m':'𝓶','n':'𝓷','o':'𝓸','p':'𝓹','q':'𝓺','r':'𝓻','s':'𝓼','t':'𝓽','u':'𝓾','v':'𝓿','w':'𝔀','x':'𝔁','y':'𝔂','z':'𝔃'};return m[c.toLowerCase()]||c}).join(''),
t=>t.toUpperCase(),
t=>t.split('').join(' '),
t=>`ꜱ${t.slice(1)}`,
t=>t.split('').map(c=>c+'̶').join(''),
t=>t.split('').map(c=>{const m={'a':'α','b':'в','c':'¢','d':'∂','e':'є','f':'ƒ','g':'g','h':'н','i':'ι','j':'נ','k':'к','l':'ℓ','m':'м','n':'η','o':'σ','p':'ρ','q':'q','r':'я','s':'ѕ','t':'т','u':'υ','v':'ν','w':'ω','x':'χ','y':'у','z':'z'};return m[c.toLowerCase()]||c}).join(''),
t=>`【${t}】`
];

const girlDecor=[
["꧁༺ "," ༻꧂"],["•°• "," •°•"],["♡ "," ♡"],["🌸 "," 🌸"],["💖 "," 💖"],
["✿ "," ✿"],["🌷 "," 🌷"],["💅 "," 💅"],["🦋 "," 🦋"],["🌙 "," 🌙"],
["💫 "," 💫"],["✨ "," ✨"],["🎀 "," 🎀"],["💜 "," 💜"],["💗 "," 💗"],
["🥰 "," 🥰"],["🌸• "," •🌸"],["꧁ "," ꧂"],["༺ "," ༻"],["♔ "," ♔"],
["👑 "," 👑"],["👸 "," 👸"],["💎 "," 💎"],["💃 "," 💃"],["🌟 "," 🌟"],
["💃• "," •💃"],["🌹 "," 🌹"],["💝 "," 💝"],["💞 "," 💞"],["🌺 "," 🌺"]
];

const boyDecor=[
["꧁༒☬ "," ☬༒꧂"],["亗 "," 亗"],["么 "," 么"],["×͜× "," ×͜×"],["☬ "," ☬"],
["👑 "," 👑"],["🔥 "," 🔥"],["💀 "," 💀"],["⚔️ "," ⚔️"],["🦁 "," 🦁"],
["💣 "," 💣"],["😎 "," 😎"],["🚀 "," 🚀"],["⚡ "," ⚡"],["💎 "," 💎"],
["꧁ "," ꧂"],["༒ "," ༒"],["◥ "," ◤"],["『 "," 』"],["• "," •"],
["🔱 "," 🔱"],["♛ "," ♛"],["⚡• "," •⚡"],["🔥• "," •🔥"],["👑• "," •👑"],
["💀• "," •💀"],["😈 "," 😈"],["☠️ "," ☠️"],["🗡️ "," 🗡️"],["💥 "," 💥"]
];

function setGender(g){
 gender=g;
 if(g==='girls'){
   document.getElementById('girlsBtn').className='girls';
   document.getElementById('boysBtn').className='boys';
   document.getElementById('title').innerText='💖 2500+ GIRLS STYLES 💖';
 } else {
   document.getElementById('girlsBtn').className='girls active2';
   document.getElementById('boysBtn').className='boys active';
   document.getElementById('title').innerText='💙 2500+ BOYS STYLES 💙';
 }
 subCat='all';
 buildSubTabs();
 generate();
}

function buildSubTabs(){
 let el=document.getElementById('subTabs'); el.innerHTML='';
 let cats= gender==='girls' ? ['all','cute','queen','soft','aesthetic'] : ['all','attitude','pubg','king','danger'];
 cats.forEach(c=>{
   let d=document.createElement('div'); d.className='subTab'+(c===subCat?' active':'');
   d.innerText=c.toUpperCase(); d.onclick=()=>{subCat=c; buildSubTabs(); generate();};
   el.appendChild(d);
 });
}

function generate(){
 let inputVal=document.getElementById('nameInput').value.trim();
 if(!inputVal){
   document.getElementById('list').innerHTML='<p style="text-align:center;color:#444;padding:30px 10px">👆 write name likho<br>5000+ stylish names ayenge<br><br>💖 Girls = Cute, Queen, Soft<br>💙 Boys = Attitude, PUBG, King</p>';
   document.getElementById('count').innerText='WRITE NAME TO SEE 5000 STYLES';
   return;
 }
 let decor = gender==='girls' ? girlDecor : boyDecor;
 let filteredDecor = decor;
 if(subCat==='cute') filteredDecor=decor.slice(0,10);
 if(subCat==='queen' || subCat==='king') filteredDecor=decor.slice(15,25);
 if(subCat==='soft' || subCat==='aesthetic') filteredDecor=decor.slice(10,20);
 if(subCat==='attitude' || subCat==='danger') filteredDecor=decor.slice(5,15);
 if(subCat==='pubg') filteredDecor=decor.slice(0,5);

 let list=[];
 let target=2500;

 for(let i=0;i<target;i++){
   let font = fancy[i % fancy.length];
   let dec = filteredDecor[i % filteredDecor.length];
   let extra = i>2000 ? (i%3==0?' ✨': i%3==1?' 💖':' 🔥') : '';
   let styled = font(inputVal);
   let final = `${dec[0]}${styled}${dec[1]}${extra}`;
   list.push(final);
 }

 // Add 500 more with numbers and extra styles
 for(let i=0;i<500;i++){
   let font = fancy[(i+3)%fancy.length];
   let dec = filteredDecor[i % filteredDecor.length];
   let styled = font(inputVal);
   list.push(`${dec[0]}${styled} ${100+i}${dec[1]}`);
 }

 list=[...new Set(list)].slice(0,3000);

 let container=document.getElementById('list'); container.innerHTML='';
 document.getElementById('count').innerText=`SHOWING ${list.length}+ STYLES FOR ${gender.toUpperCase()} • TOTAL 5000+`;

 // Render in chunks for performance
 let chunkSize=100;
 let idx=0;
 function renderChunk(){
   let end=Math.min(idx+chunkSize, list.length);
   for(let j=idx;j<end;j++){
     let t=list[j];
     let d=document.createElement('div');
     d.className='card '+(gender==='girls'?'girlCard':'boyCard');
     d.innerHTML=`<div class="name">${t}</div><button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.firstChild.innerText);this.innerText='COPIED';setTimeout(()=>this.innerText='COPY',1000)">COPY</button>`;
     container.appendChild(d);
   }
   idx=end;
   if(idx<list.length) setTimeout(renderChunk, 30);
 }
 renderChunk();
}

buildSubTabs();
generate();
</script>
</body>
</html>
