<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1000+ Stylish Names - Girls & Boys | By Samama</title>
<meta name="theme-color" content="#FF006A">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#000;color:#fff;min-height:100vh}
.header{padding:20px;text-align:center;position:sticky;top:0;z-index:10;background:rgba(0,0,0,0.9);backdrop-filter:blur(15px);border-bottom:1px solid #222}
.header h1{font-size:22px;font-weight:800}
.mainTab{display:flex;gap:10px;padding:12px;background:#000;position:sticky;top:75px;z-index:9}
.mainTab div{flex:1;padding:14px;text-align:center;border-radius:100px;font-weight:800;font-size:13px;cursor:pointer;border:2px solid #222}
.mainTab .girls{background:linear-gradient(135deg,#FF006A,#FF8A9B);color:#fff;border-color:transparent;box-shadow:0 4px 15px rgba(255,0,106,0.3)}
.mainTab .boys{background:#111;color:#888}
.mainTab .boys.active{background:linear-gradient(135deg,#0066FF,#00D4FF);color:#fff;border-color:transparent;box-shadow:0 4px 15px rgba(0,102,255,0.3)}
.mainTab .girls.active2{background:#111;color:#888;box-shadow:none}
.container{max-width:480px;margin:0 auto;padding:12px}
.box{background:#111;border:1px solid #222;border-radius:18px;padding:14px}
.box input{width:100%;padding:15px;background:#000;border:1.5px solid #333;border-radius:12px;color:#fff;font-size:16px;font-weight:700;text-align:center;outline:none}
.box input::placeholder{color:#555}
.box input:focus{border-color:#FF006A}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#FF006A,#FFD600);border:0;border-radius:100px;color:#000;font-weight:800;font-size:14px;margin-top:10px;cursor:pointer}
.subTabs{display:flex;gap:6px;overflow:auto;padding:12px 0}.subTabs::-webkit-scrollbar{display:none}
.subTab{padding:7px 12px;background:#111;border:1px solid #222;border-radius:100px;font-size:10px;font-weight:700;white-space:nowrap;cursor:pointer}.subTab.active{background:#fff;color:#000}
.card{background:#0F0F0F;border:1px solid #222;border-radius:14px;padding:12px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.card.girlCard{border-left:3px solid #FF006A}
.card.boyCard{border-left:3px solid #00D4FF}
.name{font-size:15px;flex:1;padding-right:8px;word-break:break-all}
.copy{padding:6px 12px;background:#fff;color:#000;border:0;border-radius:100px;font-size:11px;font-weight:800;cursor:pointer;min-width:60px}.copy.copied{background:#00FF88}
.count{font-size:10px;color:#666;margin:8px 0;font-weight:700;letter-spacing:1px}
.foot{text-align:center;padding:18px;font-size:8px;color:#333;letter-spacing:2px}
</style>
</head>
<body>
<div class="header">
<h1 id="title">💖 1000+ GIRLS & BOYS NAMES 💙</h1>
<p style="font-size:9px;color:#666;margin-top:4px">LARKIYON KE LIYE CUTE • LARKON KE LIYE ATTITUDE</p>
</div>

<div class="container">
<div class="mainTab">
<div id="girlsBtn" class="girls" onclick="setGender('girls')">💖 GIRLS 500</div>
<div id="boysBtn" class="boys" onclick="setGender('boys')">💙 BOYS 500</div>
</div>

<div class="box">
<input id="nameInput" type="text" placeholder="write name" value="" oninput="generate()">
<button class="btn" onclick="generate()">✨ GENERATE STYLES ✨</button>
</div>

<div class="subTabs" id="subTabs"></div>
<div class="count" id="count"></div>
<div id="list"></div>

<div class="foot">MADE WITH 💖 BY SAMAMA • GHAKHAR • 1000+ STYLES</div>
</div>

<script>
let gender='girls';
let subCat='all';

const fancy=[
t=>t,
t=>t.split('').map(c=>{let m={'a':'ᴀ','b':'ʙ','c':'ᴄ','d':'ᴅ','e':'ᴇ','f':'ғ','g':'ɢ','h':'ʜ','i':'ɪ','j':'ᴊ','k':'ᴋ','l':'ʟ','m':'ᴍ','n':'ɴ','o':'ᴏ','p':'ᴘ','q':'ǫ','r':'ʀ','s':'ꜱ','t':'ᴛ','u':'ᴜ','v':'ᴠ','w':'ᴡ','x':'x','y':'ʏ','z':'ᴢ'};return m[c.toLowerCase()]||c}).join(''),
t=>t.split('').map(c=>{let m={'a':'𝒶','b':'𝒷','c':'𝒸','d':'𝒹','e':'𝑒','f':'𝒻','g':'𝑔','h':'𝒽','i':'𝒾','j':'𝒿','k':'𝓀','l':'𝓁','m':'𝓂','n':'𝓃','o':'𝑜','p':'𝓅','q':'𝓆','r':'𝓇','s':'𝓈','t':'𝓉','u':'𝓊','v':'𝓋','w':'𝓌','x':'𝓍','y':'𝓎','z':'𝓏'};return m[c.toLowerCase()]||c}).join(''),
t=>t.split('').map(c=>{let m={'a':'𝓪','b':'𝓫','c':'𝓬','d':'𝓭','e':'𝓮','f':'𝓯','g':'𝓰','h':'𝓱','i':'𝓲','j':'𝓳','k':'𝓴','l':'𝓵','m':'𝓶','n':'𝓷','o':'𝓸','p':'𝓹','q':'𝓺','r':'𝓻','s':'𝓼','t':'𝓽','u':'𝓾','v':'𝓿','w':'𝔀','x':'𝔁','y':'𝔂','z':'𝔃'};return m[c.toLowerCase()]||c}).join('')
];

const girlsWraps={
all:[
s=>`꧁༺ ${s} ༻꧂`,s=>`•°• ${s} •°•`,s=>`♡ ${s} ♡`,s=>`🌸 ${s} 🌸`,s=>`💖 ${s} 💖`,s=>`✿ ${s} ✿`,s=>`🌷 ${s} 🌷`,s=>`💅 ${s} 💅`,s=>`🦋 ${s} 🦋`,s=>`🌙 ${s} 🌙`,s=>`💫 ${s} 💫`,s=>`✨ ${s} ✨`,s=>`🎀 ${s} 🎀`,s=>`💜 ${s} 💜`,s=>`💗 ${s} 💗`,s=>`🌸• ${s} •🌸`,s=>`꧁ ${s} ꧂`,s=>`༺ ${s} ༻`,s=>`♔ ${s} ♔`,s=>`• ${s} •`
],
cute:[s=>`♡ ${s} ♡`,s=>`🌸 ${s} 🌸`,s=>`💖 ${s} 💖`,s=>`🎀 ${s} 🎀`,s=>`✨ ${s} ✨`,s=>`💅 ${s} 💅`,s=>`🦋 ${s} 🦋`,s=>`🌷 ${s} 🌷`,s=>`💜 ${s} 💜`,s=>`🥰 ${s} 🥰`],
queen:[s=>`👑 ${s} 👑`,s=>`👸 ${s} 👸`,s=>`💎 ${s} 💎`,s=>`♔ ${s} ♔`,s=>`꧁༺Queen ${s} ༻꧂`,s=>`★ Queen ${s} ★`,s=>`💃 ${s} 💃`,s=>`🌟 ${s} 🌟`,s=>`🔥 ${s} 🔥`,s=>`✨ ${s} ✨`],
soft:[s=>`🌙 ${s} 🌙`,s=>`☁️ ${s} ☁️`,s=>`💫 ${s} 💫`,s=>`🤍 ${s} 🤍`,s=>`🍂 ${s} 🍂`,s=>`🌸 ${s} 🌸`,s=>`✿ ${s} ✿`,s=>`•° ${s} °•`,s=>`💭 ${s} 💭`,s=>`🌊 ${s} 🌊`],
urdu:[s=>`💖 ${s} 💖`,s=>`🌙 ${s} 🌙`,s=>`✨ شہزادی ${s} ✨`,s=>`💜 ${s} جان 💜`,s=>`🥀 ${s} 🥀`,s=>`💅 ${s} 💅`,s=>`👑 ${s} 👑`,s=>`🌸 ${s} 🌸`,s=>`💗 ${s} 💗`,s=>`🦋 ${s} 🦋`]
};

const boysWraps={
all:[s=>`꧁༒☬ ${s} ☬༒꧂`,s=>`亗 ${s} 亗`,s=>`么 ${s} 么`,s=>`×͜× ${s} ×͜×`,s=>`☬ ${s} ☬`,s=>`👑 ${s} 👑`,s=>`🔥 ${s} 🔥`,s=>`💀 ${s} 💀`,s=>`⚔️ ${s} ⚔️`,s=>`🦁 ${s} 🦁`,s=>`💣 ${s} 💣`,s=>`😎 ${s} 😎`,s=>`🚀 ${s} 🚀`,s=>`⚡ ${s} ⚡`,s=>`💎 ${s} 💎`,s=>`꧁ ${s} ꧂`,s=>`༒ ${s} ༒`,s=>`◥ ${s} ◤`,s=>`『 ${s} 』`,s=>`• ${s} •`],
attitude:[s=>`😎 ${s} 😎`,s=>`🔥 ${s} 🔥`,s=>`💀 ${s} 💀`,s=>`👑 ${s} 👑`,s=>`⚔️ ${s} ⚔️`,s=>`🦁 ${s} 🦁`,s=>`💣 ${s} 💣`,s=>`🚀 ${s} 🚀`,s=>`⚡ ${s} ⚡`,s=>`💎 ${s} 💎`],
pubg:[s=>`亗 ${s} 亗`,s=>`么 ${s} 么`,s=>`×͜× ${s} ×͜×`,s=>`『ᴾᴳ』 ${s}`,s=>`ᴾᴿᴼ° ${s} °`,s=>`OP ${s}`,s=>`乂 ${s} 乂`,s=>`• ${s} •`,s=>`☬ ${s} ☬`,s=>`꧁༒ ${s} ༒꧂`],
king:[s=>`👑 King ${s} 👑`,s=>`♛ ${s} ♛`,s=>`🔱 ${s} 🔱`,s=>`👑 ${s} 👑`,s=>`💎 ${s} 💎`,s=>`🦁 ${s} 🦁`,s=>`⚡ ${s} ⚡`,s=>`🔥 ${s} 🔥`,s=>`★ ${s} ★`,s=>`꧁ King ${s} ꧂`],
urdu:[s=>`😎 ${s} 😎`,s=>`🦁 ${s} 🦁`,s=>`👑 ${s} 👑`,s=>`🔥 ${s} 🔥`,s=>`⚔️ نواب ${s} ⚔️`,s=>`💪 ${s} 💪`,s=>`😏 ${s} 😏`,s=>`💀 ${s} 💀`,s=>`🚀 ${s} 🚀`,s=>`👊 ${s} 👊`]
};

function setGender(g){
 gender=g;
 if(g==='girls'){
   document.getElementById('girlsBtn').className='girls';
   document.getElementById('boysBtn').className='boys';
   document.getElementById('title').innerText='💖 500+ GIRLS STYLES 💖';
 } else {
   document.getElementById('girlsBtn').className='girls active2';
   document.getElementById('boysBtn').className='boys active';
   document.getElementById('title').innerText='💙 500+ BOYS STYLES 💙';
 }
 subCat='all';
 buildSubTabs();
 generate();
}

function buildSubTabs(){
 let el=document.getElementById('subTabs'); el.innerHTML='';
 let cats= gender==='girls' ? ['all','cute','queen','soft','urdu'] : ['all','attitude','pubg','king','urdu'];
 cats.forEach(c=>{
   let d=document.createElement('div'); d.className='subTab'+(c===subCat?' active':'');
   d.innerText=c.toUpperCase(); d.onclick=()=>{subCat=c; buildSubTabs(); generate();};
   el.appendChild(d);
 });
}

function generate(){
 let inputVal=document.getElementById('nameInput').value.trim();
 let name = inputVal || '';
 if(name===''){ document.getElementById('list').innerHTML='<p style="text-align:center;color:#555;padding:20px">👆 write name upar likho, 500 styles ayenge</p>'; document.getElementById('count').innerText='WRITE NAME TO GENERATE'; return; }
 let wraps = gender==='girls' ? girlsWraps : boysWraps;
 let selectedWraps = wraps[subCat] || wraps['all'];
 let list=[];
 for(let fontIdx=0; fontIdx<4; fontIdx++){
   for(let wrapIdx=0; wrapIdx<selectedWraps.length; wrapIdx++){
     let styled = fancy[fontIdx](name);
     let final = selectedWraps[wrapIdx](styled);
     list.push(final);
   }
 }
 for(let i=0;i<450;i++){
   let f=fancy[i%4](name);
   let w=selectedWraps[i%selectedWraps.length];
   list.push(w(f) + (i%9==0?' ✨':''));
 }
 list=[...new Set(list)].slice(0,500);
 let container=document.getElementById('list'); container.innerHTML='';
 document.getElementById('count').innerText=`SHOWING ${list.length} STYLES FOR ${gender.toUpperCase()}`;
 list.forEach(t=>{
   let d=document.createElement('div'); d.className='card '+(gender==='girls'?'girlCard':'boyCard');
   d.innerHTML=`<div class="name">${t}</div><button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.firstChild.innerText);this.innerText='COPIED';setTimeout(()=>this.innerText='COPY',1000)">COPY</button>`;
   container.appendChild(d);
 });
}

buildSubTabs();
generate();
</script>
</body>
</html>
