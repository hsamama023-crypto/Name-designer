const fancy=[t=>t,t=>t.split('').map(c=>{const m={'a':'ᴀ','b':'ʙ','c':'ᴄ','d':'ᴅ','e':'ᴇ','f':'ғ','g':'ɢ','h':'ʜ','i':'ɪ','j':'ᴊ','k':'ᴋ','l':'ʟ','m':'ᴍ','n':'ɴ','o':'ᴏ','p':'ᴘ','q':'ǫ','r':'ʀ','s':'ꜱ','t':'ᴛ','u':'ᴜ','v':'ᴠ','w':'ᴡ','x':'x','y':'ʏ','z':'ᴢ'};return m[c.toLowerCase()]||c}).join(''),t=>t.split('').map(c=>{const m={'a':'𝒶','b':'𝒷','c':'𝒸','d':'𝒹','e':'𝑒','f':'𝒻','g':'𝑔','h':'𝒽','i':'𝒾','j':'𝒿','k':'𝓀','l':'𝓁','m':'𝓂','n':'𝓃','o':'𝑜','p':'𝓅','q':'𝓆','r':'𝓇','s':'𝓈','t':'𝓉','u':'𝓊','v':'𝓋','w':'𝓌','x':'𝓍','y':'𝓎','z':'𝓏'};return m[c.toLowerCase()]||c}).join(''),t=>t.split('').map(c=>{const m={'a':'𝓪','b':'𝓫','c':'𝓬','d':'𝓭','e':'𝓮','f':'𝓯','g':'𝓰','h':'𝓱','i':'𝓲','j':'𝓳','k':'𝓴','l':'𝓵','m':'𝓶','n':'𝓷','o':'𝓸','p':'𝓹','q':'𝓺','r':'𝓻','s':'𝓼','t':'𝓽','u':'𝓾','v':'𝓿','w':'𝔀','x':'𝔁','y':'𝔂','z':'𝔃'};return m[c.toLowerCase()]||c}).join(''),t=>t.toUpperCase()];
const girlDecor=[["꧁༺ "," ༻꧂"],["♡ "," ♡"],["🌸 "," 🌸"],["💖 "," 💖"],["🎀 "," 🎀"],["🦋 "," 🦋"],["🌙 "," 🌙"],["✨ "," ✨"],["👑 "," 👑"],["💅 "," 💅"],["💗 "," 💗"],["🌷 "," 🌷"],["💫 "," 💫"],["🥰 "," 🥰"],["👑• "," •👑"],["💎 "," 💎"],["🌹 "," 🌹"],["💝 "," 💝"],["🎀• "," •🎀"],["🌸• "," •🌸"]];
const boyDecor=[["꧁༒☬ "," ☬༒꧂"],["亗 "," 亗"],["么 "," 么"],["×͜× "," ×͜×"],["👑 "," 👑"],["🔥 "," 🔥"],["💀 "," 💀"],["⚔️ "," ⚔️"],["🦁 "," 🦁"],["😎 "," 😎"],["💣 "," 💣"],["🚀 "," 🚀"],["⚡ "," ⚡"],["🔱 "," 🔱"],["👑• "," •👑"],["🔥• "," •🔥"],["💀• "," •💀"],["⚔️• "," •⚔️"],["『 "," 』"],["◥ "," ◤"]];
function setGender(g){gender=g;document.getElementById('girlsBtn').style.background=g==='girls'?'linear-gradient(135deg,#FF006A,#FF8A9B)':'#111';document.getElementById('boysBtn').style.background=g==='boys'?'linear-gradient(135deg,#0066FF,#00D4FF)':'#111';generateNames();}
function buildSubTabs(){let el=document.getElementById('subTabs');el.innerHTML='';['all','neon','glitter','3d','barbie','signature'].forEach(c=>{let d=document.createElement('div');d.className='subTab'+(c===subCat?' active':'');d.innerText=c.toUpperCase();d.onclick=()=>{subCat=c;buildSubTabs();generateNames();};el.appendChild(d);});}

// === FIXED: AB POOORE 2500 DIKHENGE ===
function generateNames(){
 let val=document.getElementById('nameInput').value.trim();
 if(!val){
   document.getElementById('list').innerHTML='<p style="text-align:center;color:#444;padding:30px">👆 write name likho<br>POORE 2500 STYLES AYENGE<br>Scroll karte jao sab load honge</p>';
   document.getElementById('count').innerText='WRITE NAME';
   return;
 }
 let decor=gender==='girls'?girlDecor:boyDecor;
 let list=[];
 for(let i=0;i<2500;i++){
   let f=fancy[i % fancy.length];
   let d=decor[i % decor.length];
   let styled=f(val);
   let extra='';
   if(subCat==='neon') extra=' •°•';
   if(subCat==='glitter') extra=' ✨';
   if(subCat==='barbie') extra=' 🎀';
   if(subCat==='3d') extra=' ⬛';
   if(subCat==='signature') styled=`𝓢 ${styled}`;
   list.push(`${d[0]}${styled}${d[1]}${extra}`);
 }
 // unique ensure 2500
 list=[...new Set(list)];
 let extraCount=0;
 while(list.length<2500){
   let i=list.length+extraCount;
   let f=fancy[i % fancy.length];
   let d=decor[i % decor.length];
   list.push(`${d[0]}${f(val)} ${i+1}${d[1]}`);
   extraCount++;
 }

 let cont=document.getElementById('list');
 cont.innerHTML='';
 document.getElementById('count').innerText=`🔥 TOTAL ${list.length} STYLES • ${gender.toUpperCase()} • SCROLL KARO POOORE DIKHENGE`;

 let idx=0;
 function renderChunk(){
   let end=Math.min(idx+100, list.length);
   for(let j=idx;j<end;j++){
     let t=list[j];
     let cls='';if(subCat==='neon')cls='neon';if(subCat==='glitter')cls='glitter';if(subCat==='barbie')cls='barbie';if(subCat==='3d')cls='d3';if(subCat==='signature')cls='sign';
     let div=document.createElement('div');
     div.className='card '+cls;
     div.innerHTML=`<div class="name">${j+1}. ${t}</div><button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.firstChild.innerText.substring(3));this.innerText='COPIED';setTimeout(()=>this.innerText='COPY',1000)">COPY</button>`;
     cont.appendChild(div);
   }
   idx=end;
   if(idx<list.length){
     setTimeout(renderChunk, 35);
   } else {
     let done=document.createElement('div');
     done.innerHTML=`<p style="text-align:center;color:#FF006A;font-size:11px;padding:18px;font-weight:800">✅ POORE ${list.length} STYLES LOAD HO GAYE<br>GIRLS/BOYS BUTTON DABAO TO TOTAL 5000+ HO JAYENGE</p>`;
     cont.appendChild(done);
   }
 }
 renderChunk();
}

function makeWall(){let name=document.getElementById('wallName').value.trim()||document.getElementById('nameInput').value.trim()||'Samama';let canvas=document.getElementById('wallCanvas');let ctx=canvas.getContext('2d');let style=wallStyles[currentWall];let grad=ctx.createLinearGradient(0,0,0,1920);grad.addColorStop(0,style.bg[0]);grad.addColorStop(1,style.bg[1]);ctx.fillStyle=grad;ctx.fillRect(0,0,1080,1920);ctx.save();if(style.type==='glitter'){for(let i=0;i<250;i++){ctx.fillStyle=`rgba(255,215,0,${Math.random()*0.8+0.2})`;ctx.beginPath();let x=Math.random()*1080,y=Math.random()*1920,s=Math.random()*3+1;ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();}}if(style.type==='neon'){ctx.shadowBlur=45;ctx.shadowColor=style.glow;}if(style.type==='3d'){ctx.fillStyle='rgba(0,0,0,0.7)';for(let k=1;k<=10;k++){ctx.font='800 100px Poppins';ctx.textAlign='center';ctx.fillText(name,540+k*5,900+k*5);}}if(style.type==='signature'){ctx.shadowBlur=0;ctx.font='700 130px Dancing Script';ctx.fillStyle=style.color;ctx.textAlign='center';ctx.fillText(name,540,960);ctx.font='600 28px Poppins';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText('by Samama',540,1050);ctx.restore();return;}if(style.type==='barbie'){ctx.shadowBlur=0;ctx.font='800 36px Poppins';ctx.fillStyle='rgba(255,255,255,0.25)';for(let i=0;i<35;i++){ctx.fillText('🎀',Math.random()*1080,Math.random()*1920);}}ctx.fillStyle=style.color;ctx.textAlign='center';ctx.font=style.type==='barbie'?'800 95px Pacifico':'800 100px Poppins';ctx.fillText(name,540,900);ctx.shadowBlur=0;ctx.font='600 26px Poppins';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillText('BY SAMAMA',540,1860);ctx.restore();}
function downloadWall(){let a=document.createElement('a');a.download=`${document.getElementById('wallName').value||'Samama'}_${wallStyles[currentWall].name}.png`;a.href=document.getElementById('wallCanvas').toDataURL('image/png');a.click();}
function calcCouple(){let n1=document.getElementById('name1').value.trim()||'Samama';let n2=document.getElementById('name2').value.trim()||'Ali';let hash=0;for(let c of (n1+n2)) hash+=c.charCodeAt(0);let percent=(hash%41)+55;if(percent>99)percent=98;document.getElementById('coupleOut').innerHTML=`<div class="coupleResult"><div style="font-size:12px;color:#aaa">${n1.toUpperCase()} 💘 ${n2.toUpperCase()}</div><div class="per">${percent}%</div><div style="font-size:11px;margin-top:6px">${percent>85?'MADE FOR EACH OTHER 💍':'Jodi achi hai 💖'}</div><button class="btn" style="margin-top:12px" onclick="setTab('wall');document.getElementById('wallName').value='${n1} 💖 ${n2}';makeWall()">🎨 INKA WALLPAPER BANAO</button></div>`;}

let currentShayari='viral';
function buildShayariTabs(){let el=document.getElementById('shayariTabs');el.innerHTML='';Object.keys(shayaris).forEach(k=>{let d=document.createElement('div');d.className='subTab'+(k===currentShayari?' active':'');d.innerText=(k==='viral'?'VIRAL 100+':k.toUpperCase())+` (${shayaris[k].length})`;d.onclick=()=>{currentShayari=k;buildShayariTabs();renderShayari();};el.appendChild(d);});}
function renderShayari(){let cont=document.getElementById('shayariList');cont.innerHTML='';shayaris[currentShayari].forEach(s=>{let d=document.createElement('div');d.className='shayariCard';d.innerHTML=`<div class="shayariText">${s.text}</div><div class="shayariAuthor">— ${s.author}</div><div style="display:flex;gap:6px;margin-top:10px"><button class="copy" onclick="navigator.clipboard.writeText(this.parentElement.parentElement.firstChild.innerText);this.innerText='COPIED'">COPY</button><button class="copy" style="background:#111;color:#fff;border:1px solid #333" onclick="setTab('wall');document.getElementById('wallName').value='${s.text.substring(0,18)}';makeWall()">WALLPAPER</button></div>`;cont.appendChild(d);});}
function setTab(t){['names','wall','couple','shayari'].forEach(x=>{document.getElementById('sec-'+x).style.display=x===t?'block':'none';document.getElementById('tab-'+x).className=x===t?'active':'';});if(t==='wall'){buildWallOpts();makeWall();}if(t==='shayari'){buildShayariTabs();renderShayari();}}
buildSubTabs();generateNames();buildWallOpts();makeWall();buildShayariTabs();renderShayari();
</script>
